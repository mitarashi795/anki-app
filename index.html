<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaced Repetition & AI App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Anki Clone + AI</h1>

        <div id="settings-area" class="settings-box">
            <p>※AI機能を使うにはGemini APIキーが必要です。</p>
            <input type="password" id="api-key-input" placeholder="Gemini API Keyを入力">
            <button onclick="saveApiKey()">保存</button>
        </div>
        
        <div id="dashboard">
            <h2 id="due-count">今日の学習: 0件</h2>
            <button onclick="startStudy()">学習を始める</button>
            <div id="add-card-section" class="box">
                <h3>単語を追加</h3>
                <input type="text" id="new-word" placeholder="単語 (Word)">
                <input type="text" id="new-meaning" placeholder="意味 (Meaning)">
                <select id="new-pos">
                    <option value="Noun">名詞</option>
                    <option value="Verb">動詞</option>
                    <option value="Adjective">形容詞</option>
                    <option value="Adverb">副詞</option>
                </select>
                <button onclick="addCard()">追加</button>
            </div>
        </div>

        <div id="study-area" style="display: none;" class="box">
            <h2 id="study-word" class="large-text">Word</h2>
            
            <div id="pos-quiz">
                <p>この単語の品詞は？</p>
                <div class="grid-buttons">
                    <button onclick="checkPos('Noun')">名詞</button>
                    <button onclick="checkPos('Verb')">動詞</button>
                    <button onclick="checkPos('Adjective')">形容詞</button>
                    <button onclick="checkPos('Adverb')">副詞</button>
                </div>
            </div>

            <div id="meaning-area" style="display: none;">
                <p class="feedback">正解の品詞: <span id="correct-pos"></span></p>
                <h3 id="study-meaning" class="large-text">Meaning</h3>
                <p>どのくらい覚えていましたか？</p>
                <div class="rating-buttons">
                    <button onclick="rateCard(0)" class="btn-again">Again<br>(忘れた)</button>
                    <button onclick="rateCard(3)" class="btn-hard">Hard<br>(難しい)</button>
                    <button onclick="rateCard(4)" class="btn-good">Good<br>(普通)</button>
                    <button onclick="rateCard(5)" class="btn-easy">Easy<br>(簡単)</button>
                </div>
            </div>
        </div>

        <div id="ai-quiz-area" style="display: none;" class="box">
            <h2>🎉 今日の復習は完了です！</h2>
            <p>AIがあなたの単語帳から、まだ知らない意味を探してクイズを出します。</p>
            <button id="generate-ai-btn" onclick="generateAiQuiz()">AIクイズを生成</button>
            <div id="ai-loading" style="display:none;">
                <p>🤖 AIが問題を考えています...</p>
            </div>
            <div id="ai-quiz-content" style="display:none;">
                <h3 id="ai-word" class="large-text"></h3>
                <p id="ai-question"></p>
                <div id="ai-options" class="options-list"></div>
                <div id="ai-result" style="display:none;">
                    <h4 id="ai-judgement"></h4>
                    <p id="ai-explanation" class="explanation-box"></p>
                    <button onclick="location.reload()">ダッシュボードに戻る</button>
                </div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
